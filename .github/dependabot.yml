version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /services/gpu-tracker
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /services/gpu-tracker
    schedule:
      interval: monthly
